version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
  - package-ecosystem: cargo
    directory: /
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /app
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /agent
    schedule: { interval: monthly }
