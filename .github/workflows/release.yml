name: Release

# Push a tag like v0.1.0 to build both installers and attach them to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # Apple Silicon (M1/M2/M3…)
            name: Mac installer (PC Bridge.dmg)
            bundles: dmg
            pattern: target/release/bundle/dmg/*.dmg
            asset: PC Bridge.dmg
          - os: windows-latest
            name: Windows installer (PC Bridge Setup.exe)
            bundles: nsis
            pattern: target/release/bundle/nsis/*.exe
            asset: PC Bridge Setup.exe
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        working-directory: app
        shell: bash
        run: |
          npm ci
          npx tauri build --bundles ${{ matrix.bundles }}
      - name: Rename installer
        shell: bash
        run: |
          set -euo pipefail
          src=$(ls ${{ matrix.pattern }} | head -n1)
          mkdir -p out
          cp "$src" "out/${{ matrix.asset }}"
          ls -la out
      - name: Create release (if needed) and upload
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "PC Bridge $TAG" --notes-file .github/release-notes.md || true
          # GitHub turns spaces in asset file names into dots; the label keeps the readable name.
          gh release upload "$TAG" "out/${{ matrix.asset }}#${{ matrix.asset }}" --clobber
