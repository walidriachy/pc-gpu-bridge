name: Release

# Push a tag like v0.1.0 to build both installers and attach them to a GitHub release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)build, e.g. v0.1.0"
        required: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # Apple Silicon (M1/M2/M3…)
            name: Mac installer (PC Bridge.dmg)
            bundles: app,dmg
          - os: windows-latest
            name: Windows installer (PC Bridge Setup.exe)
            bundles: nsis
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (signed for automatic updates)
        working-directory: app
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::The TAURI_SIGNING_PRIVATE_KEY secret is missing, so updates can't be signed. See CONTRIBUTING.md → Releasing."
            exit 1
          fi
          npm ci
          npx tauri build --bundles ${{ matrix.bundles }}
      # tauri.conf.json → bundle.macOS.signingIdentity "-" makes Tauri sign the app "ad-hoc" (no paid
      # certificate) before it packs the .dmg and the update file. Without a full signature macOS says
      # "PC Bridge is damaged and can't be opened" instead of offering "Open Anyway".
      - name: Check the Mac app is properly signed
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          B=target/release/bundle
          check() {
            echo "--- $1"
            codesign --verify --deep --strict --verbose=2 "$1"
            info=$(codesign --display --verbose=4 "$1" 2>&1)
            echo "$info"
            if echo "$info" | grep -q "linker-signed"; then
              echo "::error::$1 only has the compiler's temporary signature; macOS would call it damaged."
              exit 1
            fi
          }
          check "$B/macos/PC Bridge.app"
          # The automatic-update file must contain the same signed app…
          upd=$(mktemp -d)
          tar -xzf "$(ls $B/macos/*.app.tar.gz | head -n1)" -C "$upd"
          check "$upd/PC Bridge.app"
          # …and so must the disk image people download.
          mnt=$(mktemp -d)
          hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$(ls $B/dmg/*.dmg | head -n1)"
          check "$mnt/PC Bridge.app"
          hdiutil detach "$mnt" || hdiutil detach -force "$mnt" || true
      - name: Collect files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          B=target/release/bundle
          if [ "$RUNNER_OS" = "macOS" ]; then
            cp "$(ls $B/dmg/*.dmg | head -n1)" "out/PC Bridge.dmg"
            cp "$(ls $B/macos/*.app.tar.gz | head -n1)" out/PC.Bridge.app.tar.gz
            cp "$(ls $B/macos/*.app.tar.gz.sig | head -n1)" out/PC.Bridge.app.tar.gz.sig
          else
            cp "$(ls $B/nsis/*-setup.exe | head -n1)" "out/PC Bridge Setup.exe"
            cp "$(ls $B/nsis/*-setup.exe.sig | head -n1)" out/PC.Bridge.Setup.exe.sig
          fi
          ls -la out
      - name: Create release (if needed) and upload
        shell: bash
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "PC Bridge $TAG" --notes-file .github/release-notes.md || true
          # GitHub turns spaces in asset file names into dots; the label keeps the readable name.
          for f in out/*; do
            name=$(basename "$f")
            gh release upload "$TAG" "$f#$name" --clobber
          done

  updater-manifest:
    name: Publish latest.json (automatic updates)
    needs: build
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ env.TAG }}
      - name: Build and upload latest.json
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern '*.sig' --dir sigs --clobber
          python3 .github/scripts/make_latest_json.py "$TAG" "$GITHUB_REPOSITORY" sigs > latest.json
          cat latest.json
          gh release upload "$TAG" latest.json --clobber
