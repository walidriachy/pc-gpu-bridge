name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent:
    name: PC agent (Python) — tests + lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e "agent[dev]"
      - name: Lint (ruff)
        working-directory: agent
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (pytest)
        working-directory: agent
        run: python -m pytest -q

  ui:
    name: App UI (TypeScript) — lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  app:
    name: Rust + app build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            bundles: dmg
          - os: windows-latest
            bundles: nsis
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install UI dependencies and build the UI
        working-directory: app
        run: |
          npm ci
          npm run build
      - name: Format check
        run: cargo fmt --all -- --check
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Rust tests (path mapping, GPU/RAM detection, router, MCP, mock-agent e2e)
        run: cargo test --workspace
        env:
          PCBRIDGE_NO_NOTIFY: "1"
      - name: Real Python agent ⇄ Rust end-to-end
        if: runner.os == 'macOS'
        shell: bash
        run: |
          python -m venv agent/.venv
          agent/.venv/bin/python -m pip install -q -e agent
          bash scripts/e2e-real-agent.sh
      - name: Build installer (${{ matrix.bundles }})
        working-directory: app
        run: npx tauri build --bundles ${{ matrix.bundles }}
      - uses: actions/upload-artifact@v6
        with:
          name: installer-${{ runner.os }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7
